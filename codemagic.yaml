workflows:
  android-debug:
    name: RGB Remote - Android Debug APK
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      flutter: stable
      java: 17
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Configure Android SDK path
        script: |
          echo "flutter.sdk=$HOME/programs/flutter" > "$CM_BUILD_DIR/android/local.properties"
          echo "sdk.dir=$ANDROID_SDK_ROOT" >> "$CM_BUILD_DIR/android/local.properties"
      - name: Get Flutter dependencies
        script: flutter pub get
      - name: Run Flutter analysis
        script: flutter analyze
      - name: Run Flutter tests
        script: flutter test
      - name: Build installable Android debug APK
        script: flutter build apk --debug
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - flutter_drive.log
      - $HOME/.gradle/daemon/**/daemon-*.out.log
    publishing:
      email:
        notify:
          success: true
          failure: true

  android-release:
    name: RGB Remote - Signed Android Release
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      flutter: stable
      java: 17
      android_signing:
        - rgbremote_keystore
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
          include: true
    scripts:
      - name: Configure Android SDK path
        script: |
          echo "flutter.sdk=$HOME/programs/flutter" > "$CM_BUILD_DIR/android/local.properties"
          echo "sdk.dir=$ANDROID_SDK_ROOT" >> "$CM_BUILD_DIR/android/local.properties"
      - name: Get Flutter dependencies
        script: flutter pub get
      - name: Build signed Android App Bundle
        script: flutter build appbundle --release
      - name: Build signed Android APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/bundle/release/*.aab
      - build/app/outputs/flutter-apk/*-release.apk
      - build/**/outputs/**/mapping.txt
      - flutter_drive.log
    publishing:
      email:
        notify:
          success: true
          failure: true
