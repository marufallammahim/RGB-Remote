name: rgb_remote
description: A Flutter application to control rgb led strip light and bulb.
publish_to: none
version: 1.5.0+6
environment:
  sdk: '>=3.7.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_font_icons: ^3.0.0
  material_neumorphic: ^1.2.1
  flutter_dropdown_alert: ^1.0.7
  shared_preferences: ^2.5.3
  package_info_plus: ^8.3.0
  url_launcher: ^6.3.1
  page_transition: ^2.2.2
  just_the_tooltip: ^0.0.12
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
