name: RGB Remote Android APK

on:
  push:
    branches:
      - fdroid/preparation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build unsigned Android release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Show toolchain
        run: |
          flutter --version
          java -version

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Run tests when present
        if: hashFiles('test/**') != ''
        run: flutter test

      - name: Build F-Droid-compatible release APK
        env:
          FDROID_BUILD: '1'
        run: flutter build apk --release

      - name: Verify APK and calculate checksum
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          mkdir -p release
          cp "$APK" release/RGB-Remote-unsigned-release.apk
          sha256sum release/RGB-Remote-unsigned-release.apk > release/SHA256SUMS.txt
          ls -lh release/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RGB-Remote-Android-unsigned-APK
          path: |
            release/RGB-Remote-unsigned-release.apk
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
