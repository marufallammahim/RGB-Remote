name: RGB Remote Smart Control Testing

on:
  push:
    branches:
      - smart-control-testing
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: smart-control-testing-recovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    name: Analyze, test and build Smart Control APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout testing branch
        uses: actions/checkout@v4
        with:
          ref: smart-control-testing

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: false

      - name: Show toolchain versions
        run: |
          flutter --version
          java -version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart source
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Build Android release APK
        run: flutter build apk --release

      - name: Prepare and verify APK
        id: package
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          mkdir -p release
          cp "$APK" release/RGB-LED-REMOTE-Smart-Control-Testing.apk
          sha256sum release/RGB-LED-REMOTE-Smart-Control-Testing.apk > release/SHA256SUMS.txt
          echo "apk=release/RGB-LED-REMOTE-Smart-Control-Testing.apk" >> "$GITHUB_OUTPUT"
          ls -lh release/

      - name: Upload testing APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RGB-LED-REMOTE-Smart-Control-Testing
          path: |
            release/RGB-LED-REMOTE-Smart-Control-Testing.apk
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="smart-control-testing-build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" \
            release/RGB-LED-REMOTE-Smart-Control-Testing.apk \
            release/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "RGB Remote Smart Control Testing Build ${GITHUB_RUN_NUMBER}" \
            --notes "Testing build from smart-control-testing. Includes Android Device Controls and the two-button Home Screen Widget (LIGHT ON / LIGHT OFF). This is a pre-release build for device testing, not a stable main-branch release." \
            --prerelease
