name: "RGB-LED-REMOTE CodeQL Security"

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  schedule:
    - cron: "24 6 * * 3"

  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze GitHub Actions
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout RGB-LED-REMOTE
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: actions
          queries: security-extended,security-and-quality

      - name: Analyze RGB-LED-REMOTE
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:actions"
