name: RGB-LED-REMOTE Signed Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: signed-android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify signed APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show toolchain
        run: |
          flutter --version
          java -version

      - name: Validate release version
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$TAG_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tags must use semantic versions such as v1.0.4."
            exit 1
          fi

          CURRENT_VERSION="$(sed -nE 's/^version:[[:space:]]*([^+]+)\+.*/\1/p' pubspec.yaml | head -n1)"
          CURRENT_CODE="$(sed -nE 's/^version:[[:space:]]*[^+]+\+([0-9]+).*/\1/p' pubspec.yaml | head -n1)"
          if [[ "$CURRENT_VERSION" != "$TAG_VERSION" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME requires pubspec version $TAG_VERSION+<versionCode>; found $CURRENT_VERSION+$CURRENT_CODE."
            exit 1
          fi
          if [[ -z "$CURRENT_CODE" ]]; then
            echo "::error::pubspec.yaml must include an Android versionCode (version: X.Y.Z+N)."
            exit 1
          fi

          PREVIOUS_TAG="$(git tag --list 'v[0-9]*' --sort=-version:refname | grep -Fxv "$GITHUB_REF_NAME" | head -n1 || true)"
          if [[ -n "$PREVIOUS_TAG" ]]; then
            PREVIOUS_PUBSPEC="$(git show "$PREVIOUS_TAG:pubspec.yaml" 2>/dev/null || true)"
            PREVIOUS_VERSION="$(printf '%s\n' "$PREVIOUS_PUBSPEC" | sed -nE 's/^version:[[:space:]]*[^+]+\+([0-9]+).*/\1/p' | head -n1)"
            if [[ -n "$PREVIOUS_VERSION" ]] && (( CURRENT_CODE <= PREVIOUS_VERSION )); then
              echo "::error::Android versionCode must increase. Previous tag $PREVIOUS_TAG used $PREVIOUS_VERSION; current is $CURRENT_CODE."
              exit 1
            fi
          fi
          echo "Validated $GITHUB_REF_NAME ($CURRENT_VERSION+$CURRENT_CODE)."

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze Dart source
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Configure persistent Android release signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done

          mkdir -p android
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          chmod 600 android/upload-keystore.jks

          cat > android/key.properties <<EOF
          storeFile=../upload-keystore.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
          chmod 600 android/key.properties

          keytool -list -keystore android/upload-keystore.jks \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" >/dev/null
          echo "Release keystore and alias validated."

      - name: Build ABI-specific release APKs
        run: |
          set -euo pipefail
          flutter build apk --release --split-per-abi
          mkdir -p build/signed-split-apks
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk build/signed-split-apks/
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/signed-split-apks/
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk build/signed-split-apks/

      - name: Build universal release APK
        run: flutter build apk --release

      - name: Verify APK signatures and prepare release files
        id: package
        shell: bash
        run: |
          set -euo pipefail
          OUT="build/app/outputs/flutter-apk"
          RELEASE="release"
          mkdir -p "$RELEASE"

          cp build/signed-split-apks/app-armeabi-v7a-release.apk "$RELEASE/RGB-LED-REMOTE-armeabi-v7a.apk"
          cp build/signed-split-apks/app-arm64-v8a-release.apk "$RELEASE/RGB-LED-REMOTE-arm64-v8a.apk"
          cp build/signed-split-apks/app-x86_64-release.apk "$RELEASE/RGB-LED-REMOTE-x86_64.apk"
          cp "$OUT/app-release.apk" "$RELEASE/RGB-LED-REMOTE-universal.apk"

          BUILD_TOOLS="$(find "$ANDROID_SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          test -x "$APKSIGNER"

          EXPECTED_CERT=""
          for APK in "$RELEASE"/*.apk; do
            "$APKSIGNER" verify --verbose "$APK"
            CERT="$("$APKSIGNER" verify --print-certs "$APK" | sed -nE 's/.*certificate SHA-256 digest: ([0-9a-fA-F]+).*/\1/p' | head -n1)"
            if [[ -z "$CERT" ]]; then
              echo "::error::Could not read signing certificate from $APK"
              exit 1
            fi
            if [[ -z "$EXPECTED_CERT" ]]; then
              EXPECTED_CERT="$CERT"
            elif [[ "$CERT" != "$EXPECTED_CERT" ]]; then
              echo "::error::APK signing certificates do not match."
              exit 1
            fi
          done

          sha256sum "$RELEASE"/*.apk > "$RELEASE/SHA256SUMS.txt"
          {
            echo "Application ID: com.marufallammahim.rgbremote"
            echo "Version: $(sed -nE 's/^version:[[:space:]]*//p' pubspec.yaml | head -n1)"
            echo "Git ref: $GITHUB_REF"
            echo "Commit: $GITHUB_SHA"
            echo "Signing certificate SHA-256: $EXPECTED_CERT"
            echo "Built at (UTC): $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } > "$RELEASE/BUILD-INFO.txt"

          echo "Signing certificate SHA-256: $EXPECTED_CERT"
          ls -lh "$RELEASE"

      - name: Upload signed APK build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RGB-LED-REMOTE-Signed-Android-APKs
          path: |
            release/*.apk
            release/SHA256SUMS.txt
            release/BUILD-INFO.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: RGB-LED-REMOTE ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release/RGB-LED-REMOTE-armeabi-v7a.apk
            release/RGB-LED-REMOTE-arm64-v8a.apk
            release/RGB-LED-REMOTE-x86_64.apk
            release/RGB-LED-REMOTE-universal.apk
            release/SHA256SUMS.txt
            release/BUILD-INFO.txt
