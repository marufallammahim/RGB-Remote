
name: RGB-LED-REMOTE Android Release

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      run_tests:
        description: 'Run Flutter tests before building'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

env:
  JAVA_VERSION: '17'

jobs:
  android:
    name: Build and Publish Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Configure Android SDK
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=$ANDROID_HOME" >> android/local.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run Flutter tests
        if: github.event_name != 'workflow_dispatch' || inputs.run_tests
        run: flutter test

      - name: Build Release APK
        run: flutter build apk --release

      - name: Prepare APK
        run: |
          mkdir -p release

          cp build/app/outputs/flutter-apk/app-release.apk \
            release/RGB-LED-REMOTE.apk

          sha256sum release/RGB-LED-REMOTE.apk \
            > release/RGB-LED-REMOTE.apk.sha256

          test -s release/RGB-LED-REMOTE.apk
          test -s release/RGB-LED-REMOTE.apk.sha256

      - name: Generate unique release tag
        id: release_tag
        run: |
          echo "tag=build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}" \
            >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.release_tag.outputs.tag }}" \
            release/RGB-LED-REMOTE.apk \
            release/RGB-LED-REMOTE.apk.sha256 \
            --target "$GITHUB_SHA" \
            --title "RGB-LED-REMOTE Build ${GITHUB_RUN_NUMBER}" \
            --notes "Automated Android release build.

          Commit: ${GITHUB_SHA}
          Branch: main
          APK: RGB-LED-REMOTE.apk

          Install the APK on your Android device.
          Built automatically using GitHub Actions."
