name: Flutter Android CI

on:
  push:
    branches:
      - beta-testing

  pull_request:
    branches:
      - beta-testing

  workflow_dispatch:
    inputs:
      run_tests:
        description: 'Run Flutter tests before building'
        required: true
        type: boolean
        default: true

permissions:
  contents: read

env:
  JAVA_VERSION: '17'

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout beta-testing branch
        uses: actions/checkout@v4
        with:
          ref: beta-testing

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Configure Android SDK path
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=$ANDROID_HOME" >> android/local.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run Flutter tests
        if: github.event_name != 'workflow_dispatch' || inputs.run_tests
        run: flutter test

      - name: Build Android release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rgb-remote-beta-testing-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
